apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-hello
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-hello
  template:
    metadata:
      labels:
        app: spring-hello
    spec:
      containers:
        - name: spring-hello
          image: anirudh544/spring-hello:5
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: spring-hello
spec:
  selector:
    app: spring-hello
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: NodePort
